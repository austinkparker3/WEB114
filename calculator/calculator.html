<!DOCTYPE HTML>
<!-- HTML file for Calculator Final Project  -->
<html lang="en">

  <head>
      <link rel="stylesheet" href="calculator.css">
  <title>Austin's Personal Calculator</title>
  <meta charset="utf-8">
  <!-- External JavaScript file -->
  <script src="calculator.js" defer></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
        background-color: #f0f8ff;
      }
      h1 { color: #2c3e50; }
    </style>
  </head>
  <body>
    <main>
      <h1><strong>Calculator</strong></h1>
        <label for="num1">First Number:</label>
          <input id="num1" type="number">
        <label for="num2">Second Number:</label>
          <input id="num2" type="number">
        <button id="addBtn">Add</button>
        <button id="subtractBtn">Subtract</button>
        <button id="multiplyBtn">Multiply</button>
        <button id="divideBtn">Divide</button>
        <button id="clearBtn">Clear</button>
        <p id="result">Result will appear here.</p>
        <p id="feedback">Choose an operation to begin.</p>
        <p id="dateDisplay"></p>
    </main>
  </body>
</html>
